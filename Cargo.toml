[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "16.0.0"	# PixelOS 16 (Android 16)
edition = "2024"
license = "MIT"
repository = "https://github.com/MothershipOS/pixelOS_16_VM"

[workspace.dependencies]
anyhow = "1"
libc = "0.2"
serde_json = "1"
android-image = { path = "crates/android-image" }

[profile.release]
lto = "thin"
strip = "debuginfo"
